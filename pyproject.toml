[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tokenoptipy"
version = "0.2.2"
description = "Local token-flow graphs, prompt hotspot detection, safe prompt optimization, and MCP tools"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "Mohamed Amrane" }
]
keywords = [
  "llm",
  "prompt",
  "tokens",
  "optimization",
  "graph",
  "static-analysis",
  "privacy",
  "mcp",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
  "mcp>=1.28,<2",
]

[project.optional-dependencies]
tiktoken = ["tiktoken>=0.7"]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.8",
  "mypy>=1.13",
  "build>=1.2",
]

[project.scripts]
tokenoptipy = "tokenoptipy.cli:main"
tokenoptipy-mcp = "tokenoptipy.mcp_server:main"

[project.urls]
Homepage = "https://github.com/MEEDamrane/TokenOptiPy"
Documentation = "https://github.com/MEEDamrane/TokenOptiPy/tree/main/docs"
Issues = "https://github.com/MEEDamrane/TokenOptiPy/issues"
Source = "https://github.com/MEEDamrane/TokenOptiPy"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = [".audit-tools", ".audit-dist", ".tmp-audit-out*"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["tokenoptipy"]
