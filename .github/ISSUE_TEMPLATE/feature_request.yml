name: Feature request
description: Propose a new backend, validator, or transformation
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    attributes:
      label: Problem
      description: What problem would this solve?
    validations:
      required: true
  - type: textarea
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    attributes:
      label: Safety and evaluation plan
      description: How will quality preservation and failure modes be tested?
    validations:
      required: true
